<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Location Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize the map
        var map = L.map('map').setView([14.0860746, 100.608406], 6);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Check if geolocation is available
        if (!navigator.geolocation) {
            console.log("Your browser doesn't support geolocation.");
        } else {
            // Update position every 5 seconds
            setInterval(() => {
                navigator.geolocation.getCurrentPosition(getPosition, handleError);
            }, 5000);
        }

        var marker, circle;

        function getPosition(position) {
            var lat = position.coords.latitude;
            var long = position.coords.longitude;
            var accuracy = position.coords.accuracy;

            // Remove the previous marker and circle, if any
            if (marker) map.removeLayer(marker);
            if (circle) map.removeLayer(circle);

            // Add new marker and circle for current location
            marker = L.marker([lat, long]).addTo(map);
            circle = L.circle([lat, long], { radius: accuracy }).addTo(map);

            // Fit map bounds to the marker and circle
            var featureGroup = L.featureGroup([marker, circle]);
            map.fitBounds(featureGroup.getBounds());

            console.log(`Your coordinate is: Lat: ${lat} Long: ${long} Accuracy: ${accuracy}`);
        }

        function handleError(error) {
            console.error(`Geolocation error: ${error.message}`);
        }

        // Disable any potential page refresh or unwanted reload
        window.addEventListener('keydown', function (e) {
            if (e.key === "F5" || (e.ctrlKey && e.key === "r")) {
                e.preventDefault();
            }
        });

    </script>
</body>
</html>
